[project]
name = "trafficlaw"
version = "0.1.0"
description = "Hỏi đáp Luật Giao thông đường bộ Việt Nam bằng Graph RAG (DATN)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "faiss-cpu>=1.16.0",
    "httpx>=0.28.1",
    "neo4j>=6.4.1",
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "pydantic>=2.7",
    "pymupdf>=2.1",
    "python-docx>=1.2.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
embed = [
    "sentence-transformers>=6.3.0",
    "tokenizers>=0.23.3",
    "torch>=2.15.0",
]
tok = [
    "tokenizers>=0.23.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trafficlaw"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "results", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "T20"]

[tool.ruff.lint.per-file-ignores]
# print chỉ bị cấm trong src/; script CLI và test được phép in.
"scripts/**" = ["T20"]
"tests/**" = ["T20"]
"app/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["trafficlaw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "slow: dùng model thật, Neo4j thật hoặc API thật",
    "gpu: cần CUDA",
]
