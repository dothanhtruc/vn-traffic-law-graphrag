# M7: lớp gọi LLM. API key KHÔNG ghi ở đây — chỉ tên biến môi trường (đọc từ môi trường / .env).
#
# main = model CHỐT cho đánh giá + demo (một model_id; đánh giá không fallback).
# 09/11/2026: mọi model TỰ HOST bằng vLLM trên GPU thuê, gọi qua SSH tunnel (provider local,
# configs/serve.yaml). model_id = served_model_name; null cho tới khi người dùng chốt sau chạy thử
# (mọi lệnh gọi LLM chính sẽ báo "chưa chốt model_id" — dùng --model khi chạy thử).
# Lịch sử: gemini-3.5-flash (duyệt 09/11) bị bỏ — free tier 20 lượt/ngày, tên model bị trỏ sang
# gemini-3.6-flash (không tái lập); API trả phí vượt ngân sách.
main:
  provider: local
  model_id: qwen3-14b-awq   # chốt 09/11/2026 (revision ghim trong configs/serve.yaml)

# Tham số chung (mọi provider); providers.<p>.params ghi đè/bổ sung.
params:
  temperature: 0
  max_output_tokens: 2048

# Fallback chỉ cho demo (FallbackClient). Không dùng API ngoài (09/11/2026) ⇒ rỗng.
fallback_order: []

retry:
  max_retries: 5            # 429 theo phút / 5xx / timeout; tối đa 1 + 5 lượt
  base_s: 1.0               # chờ lần n = max(Retry-After, U(0, min(cap, base·2^n)))
  cap_s: 60.0
  seed: 42

cache_path: data/cache/llm.sqlite          # chỉ lưu kết quả ok (gitignored)
usage_db_path: data/cache/llm_usage.sqlite # bộ đếm request/token theo ngày (RPD/TPD)
repair_prompt: format_repair               # src/trafficlaw/llm/prompts/format_repair.md

# Giới hạn = mức free tier đã tra (đặt thấp hơn/bằng mức công bố); null = không giới hạn phía mình.
# reset_utc_offset_h: giờ reset quota ngày (Gemini: 0h Pacific ≈ UTC−8, bỏ qua giờ mùa hè).
providers:
  # Server vLLM tự host trên máy thuê, qua `ssh -L 8000:127.0.0.1:8000` (scripts/gpu/tunnel.sh).
  # LOCAL_LLM_API_KEY (.env) = VLLM_API_KEY trên máy thuê. Không giới hạn rpm/tpm/rpd phía mình.
  local:
    kind: openai_compat
    base_url: http://127.0.0.1:8000/v1
    api_key_env: LOCAL_LLM_API_KEY
    model_id: null
    timeout_s: 300           # lô dài + hàng đợi khi gọi song song
    json_mode: schema        # response_format json_schema → vLLM guided decoding
    reset_utc_offset_h: 0
    params:
      seed: 42
    extra_body:
      chat_template_kwargs:
        enable_thinking: false   # Qwen3: tắt thinking (tái lập, ít token); model khác bỏ qua
  # ---- API ngoài: KHÔNG dùng từ 09/11/2026 (giữ cấu hình để tham khảo/so sánh) ----
  gemini:
    kind: gemini
    base_url: https://generativelanguage.googleapis.com/v1beta
    api_key_env: GEMINI_API_KEY
    model_id: gemini-3.5-flash
    rpm: 10
    tpm: 250000
    rpd: 20                 # free tier thật: GenerateRequestsPerDayPerProjectPerModel = 20 (429 ngày 09/11/2026)
    timeout_s: 90
    json_mode: schema       # responseMimeType + responseJsonSchema
    reset_utc_offset_h: -8
    params:
      thinking_level: low   # Gemini 3.x; cố định để tái lập (mặc định tốn ~320 token thinking/ping)
  groq:
    kind: openai_compat
    base_url: https://api.groq.com/openai/v1
    api_key_env: GROQ_API_KEY
    model_id: openai/gpt-oss-120b   # chỉ fallback demo
    rpm: 30
    tpm: 12000
    rpd: 1000
    tpd: 100000
    timeout_s: 60
    json_mode: object       # response_format json_object (prompt phải nhắc "JSON")
    reset_utc_offset_h: 0
  openrouter:
    kind: openai_compat
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    model_id: nvidia/nemotron-3-ultra-550b-a55b:free   # chỉ fallback demo
    rpm: 20
    rpd: 50
    timeout_s: 90
    json_mode: object
    reset_utc_offset_h: 0
    extra_headers:
      X-Title: vn-traffic-law-graphrag
