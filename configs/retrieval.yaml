# M10: chỉ mục truy hồi (BM25 + FAISS). Xem CLAUDE.md "Quy ước chỉ mục (M10)".
index_dir: data/index

# Chunk Khoản: trafficlaw.retrieval.chunking (M9). Phụ lục: cắt theo dòng, mỗi phần ≤ N ký tự
# (tính cả tiền tố "Phụ lục N. TIÊU ĐỀ"; người dùng chốt 10/11/2026).
phu_luc_max_chars: 1500

bm25: {k1: 1.5, b: 0.75, bigrams: true}

top_k: 20
rrf_k: 60

# Model gốc đã chốt (M11/M13/M14 dùng; người dùng chốt 14/11/2026 theo data/index/model_selection.md).
model_key: aiteamvn-vi-emb

# Ứng viên so sánh trên val (người dùng chốt 13/11/2026).
candidates: [aiteamvn-vi-emb, bge-m3, qwen3-emb-0.6b, me5-large-instruct, qwen3-emb-4b]

encode_flush_every: 512

# Model tự host, ghim hf_repo + revision (kiểm trên HF 13/11/2026). max_seq_length 512 (mục 9);
# chunk dài hơn → cửa sổ theo dòng, điểm = max (retrieval/dense.py).
# encode_tps: đo thật 14/11/2026 trên RTX 3090 bf16 (runs.jsonl, làm tròn); load_min: ước tính (tải HF lúc chậm, bge-m3 mất 8 phút).
models:
  aiteamvn-vi-emb:
    hf_repo: AITeamVN/Vietnamese_Embedding
    revision: dea33aa1ab339f38d66ae0a40e6c40e0a9249568
    params_b: 0.57
    license: apache-2.0
    family: xlm-roberta
    encode_tps: 60000
    load_min: 1.5
  # M14: fine-tune từ aiteamvn-vi-emb (scripts.train_embedding, lưới lr × 3 epoch; chọn theo val
  # dense-only R@5 → MRR@10: trafficlaw-emb-lr2e5 bước 57, data/train/embedding_selection.md).
  aiteamvn-vi-emb-ft:
    hf_repo: dothanhtruc/trafficlaw-emb-lr2e5
    revision: 1ebdce99a63c11f75b1621014cded651b222cabe
    params_b: 0.57
    license: apache-2.0
    family: xlm-roberta
    encode_tps: 60000
    load_min: 1.5
  bge-m3:
    hf_repo: BAAI/bge-m3
    revision: 5617a9f61b028005a4858fdac845db406aefb181
    params_b: 0.57
    license: mit
    family: xlm-roberta
    encode_tps: 60000
    load_min: 1.5
  qwen3-emb-0.6b:
    hf_repo: Qwen/Qwen3-Embedding-0.6B
    revision: 97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3
    params_b: 0.6
    license: apache-2.0
    family: qwen3
    # Định dạng chính thức: "Instruct: {task}\nQuery:{query}"; tài liệu không có tiền tố.
    query_prompt: "Instruct: Given a question about Vietnamese road traffic law, retrieve the legal provision that answers it\nQuery:"
    encode_tps: 28000
    load_min: 1.5
  me5-large-instruct:
    hf_repo: intfloat/multilingual-e5-large-instruct
    revision: 274baa43b0e13e37fafa6428dbc7938e62e5c439
    params_b: 0.56
    license: mit
    family: xlm-roberta
    query_prompt: "Instruct: Given a question about Vietnamese road traffic law, retrieve the legal provision that answers it\nQuery: "
    encode_tps: 60000
    load_min: 1.5
  qwen3-emb-4b:
    hf_repo: Qwen/Qwen3-Embedding-4B
    revision: 5cf2132abc99cad020ac570b19d031efec650f2b
    params_b: 4.0
    license: apache-2.0
    family: qwen3
    query_prompt: "Instruct: Given a question about Vietnamese road traffic law, retrieve the legal provision that answers it\nQuery:"
    batch_size: 16
    encode_tps: 6000
    load_min: 4

# Tập đo chọn model — KHÔNG dùng test (mục 10). Chọn theo val; tập con train chỉ kiểm độ ổn định.
eval:
  val: data/qa/val.jsonl
  train: data/qa/train.jsonl
  train_sample: 1000
  seed: 42

# Regression CI (mục 13): Recall@5 BM25 (lọc as_of) trên 100 câu val cố định; chặn khi giảm > 2 điểm %.
regression:
  n: 100
  seed: 42
  k: 5
  max_drop: 0.02
  baseline: data/qa/retrieval_baseline.json
  corpus: tests/fixtures/retrieval/corpus.jsonl.gz

# --- M11: truy hồi Graph RAG (retrieve()). Xem CLAUDE.md "Quy ước truy hồi (M11)". ---------------

# Reranker gốc (người dùng chốt 14/11/2026; M14 fine-tune từ bản này). Kiểm trên HF 15/11/2026:
# apache-2.0, không gated, fine-tune từ BAAI/bge-reranker-v2-m3. Điểm = logit thô (không sigmoid).
# Repo không có tokenizer.json ⇒ tách cửa sổ bằng tokenizer.json của model gốc bge-reranker-v2-m3
# (cùng sentencepiece XLM-R); máy thuê kiểm tra số token trùng tokenizer của reranker.
reranker_key: aiteamvn-reranker
rerankers:
  aiteamvn-reranker:
    hf_repo: AITeamVN/Vietnamese_Reranker
    revision: f536976248403314225d7fdfdbc87f0e9516a54e
    params_b: 0.57
    license: apache-2.0
    family: xlm-roberta
    max_length: 512
    batch_size: 32
    count_tokenizer:
      hf_repo: BAAI/bge-reranker-v2-m3
      revision: 953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e
    pairs_per_s: 150     # ước tính thận trọng, thay bằng số đo (data/index/rerank/<key>/runs.jsonl)
    load_min: 1.5

# Phân tích câu hỏi: rule trước; LLM main (configs/llm.yaml) chỉ khi rule không chắc.
analyze:
  catalog: data/registry/extract_catalog.yaml
  llm_fallback: true
  prompt: analyze_question
  max_output_tokens: 512
  llm_cache: data/index/analyze/llm.jsonl

# Graph expand: loại cạnh / số hop theo loại câu (người dùng duyệt 15/11/2026; chỉnh trên val/train,
# KHÔNG trên test). Mọi lần mở rộng direction=both, lọc as_of (trừ A2).
expand:
  default: {edge_types: [DAN_CHIEU], hops: 1}
  by_type:
    muc_phat: {edge_types: [BI_XU_PHAT, BI_TRU_DIEM, DAN_CHIEU], hops: 1}
    tru_diem: {edge_types: [BI_XU_PHAT, BI_TRU_DIEM, DAN_CHIEU], hops: 1}
    bien_phap: {edge_types: [BI_XU_PHAT, BI_TRU_DIEM, DAN_CHIEU], hops: 1}
    da_buoc: {edge_types: [DAN_CHIEU, BI_XU_PHAT, BI_TRU_DIEM, HUONG_DAN], hops: 2}
  max_chunks: 30
  per_node_max: 5
  reverse_sanctions: true

# Cấu hình truy hồi (CLAUDE.md mục 10). dense_model/reranker_model null → model_key/reranker_key
# (M14 thay hai khoá này bằng bản fine-tune ⇒ G dùng bản fine-tune, A3 giữ bản gốc ghi tường minh).
configs:
  B1: {description: BM25, bm25: true, dense: false, analyzer_llm: false}
  B2: {description: vector gốc, bm25: false, dense: true, dense_model: aiteamvn-vi-emb, analyzer_llm: false}
  # B3 = hybrid + rerank với model GỐC ghi tường minh (người dùng chọn 18/11/2026): sau M14, G vs B3
  # = đồ thị + fine-tune; A3 tách riêng fine-tune; A1 tách riêng expand.
  B3: {description: hybrid + rerank (model gốc), bm25: true, dense: true, dense_model: aiteamvn-vi-emb, reranker: true, reranker_model: aiteamvn-reranker, analyzer_llm: false}
  G: {description: Graph RAG đầy đủ, bm25: true, dense: true, reranker: true, graph_expand: true}
  A1: {description: G bỏ graph expand, bm25: true, dense: true, reranker: true, graph_expand: false}
  A2: {description: G bỏ lọc hiệu lực, bm25: true, dense: true, reranker: true, graph_expand: true, validity_filter: false}
  A3:
    description: G với embedding/reranker gốc (chưa có bản fine-tune ⇒ trùng G tới M14)
    bm25: true
    dense: true
    dense_model: aiteamvn-vi-emb
    reranker: true
    reranker_model: aiteamvn-reranker
    graph_expand: true
  # M13c — biến thể CHỈ đo trên tập dev (data/qa/dev_multi.jsonl), khai báo trước khi chạy.
  # Chọn theo dev; test chỉ đo lần cuối. Mọi biến thể = G + đúng một thay đổi (hoặc hai, ghi rõ).
  XG_r1: {description: G + 1 chỗ top-5 dành cho chunk đồ thị, bm25: true, dense: true, reranker: true, graph_expand: true, reserved_graph_slots: 1}
  XG_all2:
    description: G với bảng expand đa bước (4 loại cạnh, 2 hop) cho mọi loại câu (analyzer có thể gán nhầm loại)
    bm25: true
    dense: true
    reranker: true
    graph_expand: true
    expand:
      default: {edge_types: [DAN_CHIEU, BI_XU_PHAT, BI_TRU_DIEM, HUONG_DAN], hops: 2}
      by_type: {}
  XG_all2_r1:
    description: XG_all2 + 1 chỗ top-5 dành cho chunk đồ thị
    bm25: true
    dense: true
    reranker: true
    graph_expand: true
    reserved_graph_slots: 1
    expand:
      default: {edge_types: [DAN_CHIEU, BI_XU_PHAT, BI_TRU_DIEM, HUONG_DAN], hops: 2}
      by_type: {}
