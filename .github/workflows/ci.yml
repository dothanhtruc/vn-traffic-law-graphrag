name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install antiword (đọc .doc, M2)
        run: sudo apt-get update && sudo apt-get install -y antiword
      - name: Install
        run: uv sync --locked
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Pytest
        run: uv run pytest -q -m "not slow and not gpu"
      # TODO(M13): uv run python -m scripts.eval smoke --fake
