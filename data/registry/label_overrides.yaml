# Sửa thủ công nhãn Khoản/Điểm ghi sai trong bản gốc (M3, scripts.ingest --stage structure).
#
# - Chỉ đổi số hiệu + mã unit; `text` của unit giữ nguyên văn (vẫn bắt đầu bằng nhãn gốc),
#   unit có thêm `label_in_source` = nhãn gốc.
# - Dòng được nhận diện bằng `label_in_source` + `text_starts_with` (phần sau nhãn) nằm trong
#   đúng Điều/Khoản cha của `unit_id`. Mục nào không khớp đúng một dòng → script thoát mã 1
#   (văn bản nguồn đã đổi, cần xem lại).
# - Mỗi mục phải có `evidence`: căn cứ kiểm chứng được, không suy đoán nội dung.
# Người dùng quyết định sửa ngày 07/11/2026.

overrides:
