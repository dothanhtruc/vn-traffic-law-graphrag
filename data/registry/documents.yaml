# Danh mục 36 văn bản (bản tổng hợp Phase 2, tra cứu 03/11/2026). Schema:
# src/trafficlaw/registry/schema.py (DocumentMeta). Kiểm tra: uv run python -m scripts.validate_registry
#
# Quy ước:
# - Mọi ngày lấy từ chính văn bản trong data/raw/ (đối chiếu ngày 05/11/2026). Không có căn cứ → null.
# - Giá trị không có trong file gốc nhưng có trong data/raw/TongHopThongTinDataset_Phase2.docx
#   được dùng khi người dùng đồng ý (05/11/2026); notes ghi "Nguồn: bản tổng hợp Phase 2, mục N".
# - hieu_luc_den: ngày cuối còn hiệu lực (bao gồm). Bị thay từ ngày D → hieu_luc_den = D − 1.
# - relations đi TỪ văn bản này TỚI target. Quan hệ tới Khoản/Điểm cụ thể làm ở M5.
# - is_amendment: true → không chỉ mục độc lập; nội dung đi vào phiên bản điều khoản bị sửa (M4).
# - Hiệu lực riêng của từng Khoản/Điểm (vd. khoản 3 Điều 10 Luật 36) chỉ ghi trong notes;
#   biểu diễn thật ở unit_versions.jsonl (M4).

